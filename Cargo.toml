[workspace]
resolver = "2"
members = ["app_crates/*"]
exclude = ["crates/_starters/start-dioxus-fullstack"]

[package]
name = "dioxus-ui"
version = "0.1.0"
authors = ["Max Wells <maxwells.pro@proton.me>"]
edition = "2024"
publish = false

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Pin 0.7.9: dioxus 0.7.10 requires dioxus-desktop 0.7.10, unavailable on crates.io.
dioxus = { version = "=0.7.9", features = ["router", "fullstack"] }
dioxus-html = { version = "=0.7.9" }
registry.workspace = true
app_config.workspace = true
app_routes.workspace = true
app_domain.workspace = true
icons.workspace = true
tw_merge.workspace = true
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
html_parser = "0.7.0"
toml = "0.8"
serde.workspace = true
serde_json.workspace = true
js-sys.workspace = true
syntect = { version = "5.2", default-features = false, features = ["default-fancy", "regex-fancy"] }
html-escape = { version = "0.2" }
reqwest = { workspace = true, optional = true }
resend-rs = { workspace = true, optional = true }
validator = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
strum.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

[build-dependencies]
time = { version = "0.3", features = ["local-offset"] }

[workspace.dependencies]
registry = { path = "app_crates/registry" }
app_config = { path = "app_crates/app_config" }
app_domain = { path = "app_crates/app_domain" }
app_routes = { path = "app_crates/app_routes" }

icons = { version = "0.18", features = ["dioxus", "dioxus_animated"] }
tw_merge = { version = "0.1", features = ["debug"] }
heck = "0.5"
strum = { version = "0.27", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["serde", "wasm-bindgen"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
resend-rs = { version = "0.19", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
validator = { version = "0.20", features = ["derive"] }
tracing = "0.1"
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", default-features = false, features = [
  "Blob", "BlobPropertyBag", "Clipboard", "console", "CssStyleDeclaration",
  "Document", "DomRect", "DomTokenList", "DragEvent", "Element", "Event",
  "EventTarget", "Headers", "History", "HtmlAnchorElement", "HtmlElement",
  "HtmlInputElement", "InputEvent", "KeyboardEvent", "Location", "MediaQueryList",
  "MouseEvent", "MutationObserver", "MutationObserverInit", "MutationRecord",
  "Navigator", "Node", "NodeList", "Request", "RequestInit", "RequestMode",
  "Response", "ScrollToOptions", "Storage", "Url", "Window",
] }

[profile.dev]
debug = false
panic = "abort"
incremental = true
codegen-units = 256
overflow-checks = false
split-debuginfo = "unpacked"

[profile.dev.build-override]
opt-level = 3
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'

[workspace.lints.clippy]
# Groups first, negative priority: explicit policy below always wins.
# TODO: Re-enable these groups after the deployment path is stable, then clean lint debt incrementally.
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -2 }
cargo = { level = "warn", priority = -2 }

# Temporary deployment mode: lint policy relaxed; restore strict checks after deploy.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
get_unwrap = "deny"
await_holding_lock = "deny"
await_holding_invalid_type = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
enum_glob_use = "deny"
infinite_loop = "deny"
large_stack_arrays = "deny"
lossy_float_literal = "deny"
float_cmp = "deny"
mem_forget = "deny"
exit = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
mutex_atomic = "deny"
# TODO: Re-enable after replacing literal `.to_string()` calls with `.to_owned()`.
str_to_string = "allow"
# TODO: Re-enable after string-building cleanup in registry.
string_add = "allow"
format_push_string = "allow"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
# TODO: Re-enable after making unordered iteration deterministic where needed.
iter_over_hash_type = "allow"
as_underscore = "deny"
semicolon_if_nothing_returned = "allow"

# Quality ratchet.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
redundant_clone = "allow"
inefficient_to_string = "allow"
cloned_instead_of_copied = "allow"
manual_let_else = "allow"
trivially_copy_pass_by_ref = "allow"
explicit_iter_loop = "allow"
from_over_into = "allow"
fallible_impl_from = "allow"
clone_on_ref_ptr = "allow"
needless_borrow = "allow"
needless_pass_by_value = "allow"
unused_async = "allow"
# TODO: Clean up documentation markup, literal separators, and derives, then re-enable.
doc_markdown = "allow"
unreadable_literal = "allow"
derive_partial_eq_without_eq = "allow"
# TODO: Raise this after migrating JSX/event-handler syntax across the registry.
needless_raw_string_hashes = "allow"
print_stdout = "warn" # build.rs needs Cargo directive output
# TODO: Replace diagnostic stderr output with structured logging.
print_stderr = "allow"

# Nursery group is unstable and false-positive prone; keep the group at `warn`
# but silence the members that flood the registry. Revisit per the group TODO above.
missing_const_for_fn = "allow"
suboptimal_flops = "allow"
imprecise_flops = "allow"
option_if_let_else = "allow"
return_self_not_must_use = "allow"

# TODO(strict-clippy): burn-down bucket. See __SKILLS_SOP/strict-clippy-burndown.md.
# These block `-D warnings` but sit almost entirely inside rsx! macro bodies, so
# `cargo clippy --fix` cannot touch them. Remove one entry per pass, fix its sites,
# keep the gate green. Site counts captured 2026-09-10.
use_self = "allow"                            # ~215
# `MarkdownType` in the generated src/__registry__/static_md_registry.rs has a
# `Static` prefix on every variant. The file is codegen output from
# rust_ui_internals/build_registry_dioxus, so fix the generator to emit an inline
# allow, then drop this. Hand-written route enums already carry inline allows.
enum_variant_names = "allow"                  # 1 (generated file)
# `&Option<T>` params in bug_reports_sqlite: hashed as-is for similarity grouping,
# switching to `Option<&T>` would change stored hash values.
ref_option = "allow"
# False positive from the dioxus `asset!` macro expansion (`&[u8]` not volatile).
volatile_composites = "allow"

# Intentional project choices.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cognitive_complexity = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
too_many_lines = "allow"
allow_attributes = "allow"
allow_attributes_without_reason = "allow"

[workspace.lints.rust]
# Temporary deployment mode: suppress ordinary compiler warnings; explicit safety denies above remain active.
warnings = "allow"
dead_code = "allow"
unsafe_code = "forbid"
unused_variables = "allow"
unused_mut = "allow"
irrefutable_let_patterns = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"
let_underscore_lock = "deny"
unit_bindings = "deny"
macro_use_extern_crate = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "allow"
# TODO: Re-enable once the generated/UI event-handler code is cleaned up.
unused_qualifications = "allow"
unreachable_pub = "allow"
redundant_lifetimes = "allow"
trivial_numeric_casts = "allow"
keyword_idents_2024 = "allow"
elided_lifetimes_in_paths = "allow"
# TODO: Re-enable after removing redundant imports from registry UI modules.
redundant_imports = "allow"
meta_variable_misuse = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "warn"
unescaped_backticks = "warn"

[features]
default = ["web"]
server = ["dioxus/server", "dep:reqwest", "dep:resend-rs", "dep:validator", "dep:tracing", "dep:tower-http", "dep:tokio", "dep:rusqlite"]
web = ["dioxus/web"]
