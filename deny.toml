# Dependency policy. Run with: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# TODO: Replace syntect or remove its legacy parser dependencies.
ignore = [
    "RUSTSEC-2025-0141", # bincode, pulled by syntect
    "RUSTSEC-2024-0320", # yaml-rust, pulled by syntect
]

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "git2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
