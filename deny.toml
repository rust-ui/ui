# Dependency policy. Run with: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# TODO: Replace syntect or remove its legacy parser dependencies.
ignore = [
    "RUSTSEC-2025-0141", # bincode, pulled by syntect
    "RUSTSEC-2024-0320", # yaml-rust, pulled by syntect
    "RUSTSEC-2025-0057", # fxhash, pulled by wry/dioxus-desktop, no safe upgrade
    "RUSTSEC-2024-0436", # paste, pulled by dioxus-desktop (image/rav1e), no safe upgrade
    "RUSTSEC-2024-0370", # proc-macro-error, pulled by dioxus-desktop, no safe upgrade
]

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    "BSL-1.0",
    "NCSA", # libfuzzer-sys, pulled by dioxus-desktop (image/rav1e/ravif)
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
deny = [
    # allowed only via native-tls, pulled by dioxus-devtools websocket (tungstenite)
    { name = "openssl", wrappers = ["native-tls"] },
    { name = "openssl-sys", wrappers = ["native-tls", "openssl"] },
    { name = "git2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
