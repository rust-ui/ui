<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Route tree: an AppLayout wraps a HomeLayout and an ArticlesLayout, each rendering child routes through an Outlet" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect width="800" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="400" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Nested layouts and Outlet</text>
<rect x="290" y="56" width="220" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="400" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">AppLayout</text><text x="400" y="99" text-anchor="middle" font-size="12" fill="#475569">header + footer + Outlet</text>
<line x1="350" y1="112" x2="190" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="450" y1="112" x2="610" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="80" y="150" width="220" height="56" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="190" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">HomeLayout</text><text x="190" y="193" text-anchor="middle" font-size="12" fill="#475569">Outlet</text>
<rect x="500" y="150" width="220" height="56" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="610" y="174" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">ArticlesLayout</text><text x="610" y="193" text-anchor="middle" font-size="12" fill="#475569">Outlet</text>
<line x1="190" y1="206" x2="190" y2="236" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="560" y1="206" x2="500" y2="236" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="660" y1="206" x2="700" y2="236" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
