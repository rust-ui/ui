<rect x="420" y="236" width="160" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="500" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">"/articles"</text>
<rect x="610" y="236" width="170" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="695" y="263" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">"/articles/:slug"</text></svg>
