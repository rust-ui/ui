<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-label="Diagram of Dioxus reactive flow: a signal feeds a memo, the memo feeds rsx, rsx renders the DOM, and effects run side effects after reads" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect width="800" height="250" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="400" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Dioxus reactive flow</text><rect x="30" y="90" width="150" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="105.0" y="121.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">use_signal</text><text x="105.0" y="141.0" text-anchor="middle" font-size="12" fill="#475569">state you own</text><line x1="180" y1="125" x2="235" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="235" y="90" width="150" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="310.0" y="121.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">use_memo</text><text x="310.0" y="141.0" text-anchor="middle" font-size="12" fill="#475569">derived value</text><line x1="385" y1="125" x2="440" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="90" width="150" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="515.0" y="121.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">rsx!</text><text x="515.0" y="141.0" text-anchor="middle" font-size="12" fill="#475569">UI description</text><line x1="590" y1="125" x2="640" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="640" y="90" width="130" height="70" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="705.0" y="121.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">DOM</text><text x="705.0" y="141.0" text-anchor="middle" font-size="12" fill="#475569">web / native</text><rect x="235" y="185" width="150" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="310.0" y="203.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">use_effect</text><text x="310.0" y="223.0" text-anchor="middle" font-size="12" fill="#475569">side effects only</text><line x1="310" y1="185" x2="310" y2="162" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><line x1="120" y1="160" x2="120" y2="207" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="120.0" y="175.5" text-anchor="middle" font-size="12" fill="#475569">event</text><line x1="120" y1="207" x2="235" y2="207" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/></svg>
