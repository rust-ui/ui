<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" role="img" aria-label="State diagram: idle moves to loading, then to ready, empty or failed; failed can retry back to loading" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect width="800" height="260" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="400" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Four async UI states</text><rect x="30" y="100" width="130" height="60" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="95.0" y="135.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Idle</text><line x1="160" y1="130" x2="215" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="215" y="100" width="150" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="290.0" y="126.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Loading</text><text x="290.0" y="146.0" text-anchor="middle" font-size="12" fill="#475569">skeleton</text><line x1="365" y1="115" x2="470" y2="60" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="365" y1="130" x2="470" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="365" y1="145" x2="470" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="470" y="34" width="150" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="545.0" y="56.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Ready</text><text x="545.0" y="76.0" text-anchor="middle" font-size="12" fill="#475569">data shown</text><rect x="470" y="104" width="150" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="545.0" y="126.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Empty</text><text x="545.0" y="146.0" text-anchor="middle" font-size="12" fill="#475569">first-run CTA</text><rect x="470" y="174" width="150" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="545.0" y="196.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Failed</text><text x="545.0" y="216.0" text-anchor="middle" font-size="12" fill="#475569">retry returns to Loading</text></svg>
