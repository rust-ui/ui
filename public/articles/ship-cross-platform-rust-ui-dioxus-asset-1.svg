<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-label="Architecture diagram: shared Dioxus code feeds web, desktop and mobile targets, each reaching platform APIs through a small cfg-gated edge" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect width="800" height="330" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="400" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">One codebase, three targets</text><rect x="250" y="56" width="300" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="400.0" y="87.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Shared Dioxus code</text><text x="400.0" y="107.0" text-anchor="middle" font-size="12" fill="#475569">components, routes, state</text><line x1="330" y1="126" x2="150" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="400" y1="126" x2="400" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="470" y1="126" x2="650" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="50" y="196" width="200" height="52" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="150.0" y="218.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Web</text><text x="150.0" y="238.0" text-anchor="middle" font-size="12" fill="#475569">WebAssembly + DOM</text><rect x="300" y="196" width="200" height="52" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="400.0" y="218.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Desktop</text><text x="400.0" y="238.0" text-anchor="middle" font-size="12" fill="#475569">native webview</text><rect x="550" y="196" width="200" height="52" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="650.0" y="218.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">iOS / Android</text><text x="650.0" y="238.0" text-anchor="middle" font-size="12" fill="#475569">webview + native shell</text><rect x="50" y="268" width="700" height="40" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="400.0" y="293.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Platform edge: cfg(...) hooks for clipboard, storage, files, asset!()</text><line x1="150" y1="248" x2="150" y2="266" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><line x1="400" y1="248" x2="400" y2="266" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><line x1="650" y1="248" x2="650" y2="266" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/></svg>
