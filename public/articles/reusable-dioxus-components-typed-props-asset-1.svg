<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" role="img" aria-label="Component tree where a Page passes typed props down to Button and Card, and Button sends events up through an EventHandler" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect width="800" height="290" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="400" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Typed props: data down, events up</text><rect x="300" y="60" width="200" height="52" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="400.0" y="82.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Page</text><text x="400.0" y="102.0" text-anchor="middle" font-size="12" fill="#475569">owns state: Signal</text><rect x="80" y="170" width="200" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="180.0" y="196.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Button</text><text x="180.0" y="216.0" text-anchor="middle" font-size="12" fill="#475569">props: variant, size</text><rect x="520" y="170" width="200" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="620.0" y="196.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Card</text><text x="620.0" y="216.0" text-anchor="middle" font-size="12" fill="#475569">props: children</text><line x1="360" y1="112" x2="200" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="280.0" y="132.0" text-anchor="middle" font-size="12" fill="#475569">props down</text><line x1="440" y1="112" x2="600" y2="168" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="520.0" y="132.0" text-anchor="middle" font-size="12" fill="#475569">props down</text><line x1="150" y1="168" x2="320" y2="114" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="235.0" y="133.0" text-anchor="middle" font-size="12" fill="#475569">EventHandler up</text><text x="400" y="262" text-anchor="middle" font-size="12" fill="#475569">Typed props make the contract between parent and child a compile-time check</text></svg>
