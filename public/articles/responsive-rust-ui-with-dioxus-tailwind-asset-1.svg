<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Layout diagram: a single stacked column by default that becomes two columns from the lg breakpoint" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect width="800" height="300" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="400" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Mobile-first layout with Tailwind</text><text x="150" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Base (under 1024px)</text><rect x="60" y="85" width="180" height="50" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="150.0" y="106.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Main content</text><text x="150.0" y="126.0" text-anchor="middle" font-size="12" fill="#475569">min-w-0</text><rect x="60" y="145" width="180" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="150.0" y="166.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Aside</text><text x="150.0" y="186.0" text-anchor="middle" font-size="12" fill="#475569">stacked</text><rect x="60" y="205" width="180" height="40" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="150.0" y="230.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Footer</text><text x="580" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">lg: (1024px and up)</text><rect x="400" y="85" width="220" height="160" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="510.0" y="161.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Main content</text><text x="510.0" y="181.0" text-anchor="middle" font-size="12" fill="#475569">lg:grid-cols-[1.4fr_1fr]</text><rect x="630" y="85" width="140" height="160" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="700.0" y="161.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Aside</text><text x="700.0" y="181.0" text-anchor="middle" font-size="12" fill="#475569">side by side</text><line x1="260" y1="150" x2="385" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="322.5" y="142.0" text-anchor="middle" font-size="12" fill="#475569">add columns</text><text x="400" y="278" text-anchor="middle" font-size="12" fill="#475569">Write the narrow layout first, then add a prefix only where the content stops fitting</text></svg>
