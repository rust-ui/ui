<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" role="img" aria-label="Form flow diagram: an input updates a signal, validation runs on the value, and the result either shows a field error or allows submit" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect width="800" height="250" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="400" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Form data flow in Dioxus</text><rect x="30" y="90" width="140" height="60" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="100.0" y="116.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Input</text><text x="100.0" y="136.0" text-anchor="middle" font-size="12" fill="#475569">oninput</text><line x1="170" y1="120" x2="225" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="225" y="90" width="150" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="300.0" y="116.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Signal</text><text x="300.0" y="136.0" text-anchor="middle" font-size="12" fill="#475569">value + touched</text><line x1="375" y1="120" x2="430" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="430" y="90" width="150" height="60" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="505.0" y="116.0" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Validate</text><text x="505.0" y="136.0" text-anchor="middle" font-size="12" fill="#475569">validate(&amp;str)</text><line x1="580" y1="105" x2="640" y2="70" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><line x1="580" y1="135" x2="640" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="640" y="44" width="130" height="52" 